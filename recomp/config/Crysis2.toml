# XenonRecomp configuration for Crysis 2 (Xbox 360, title 454108E3, version 0.0.0.2)
# Paths are relative to this file.

[main]
file_path = "../../extracted/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "Crysis2_switch_tables.toml"

# Registers as C++ locals: only for the functions in local_functions (needs the
# patched XenonRecomp, analysis/XenonRecomp-crysis2.patch); every other function
# keeps all registers in ctx. Locals for the whole program changed shadows
# (2026-11-09 side session), so each function here is checked on its own.
skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
# 0x82A2FC40: the main thread's coverage-buffer occlusion test (a fifth of its
# time at the pier), a leaf with a SIMD loop: 20% -> 17%, picture unchanged.
local_functions = [ 0x82A2FC40 ]

# Register save/restore helpers, found by the byte signatures in XenonRecomp's README
# (each matched exactly once in .text).
restgprlr_14_address = 0x8347A120
savegprlr_14_address = 0x8347A0D0
restfpr_14_address = 0x8347A7BC
savefpr_14_address = 0x8347A770
restvmx_14_address = 0x83487458
savevmx_14_address = 0x834871C0
restvmx_64_address = 0x834874EC
savevmx_64_address = 0x83487254

# longjmp: restores FPRs/VMX from the buffer, then LR (+308), r1 (+144) and CR (+304),
# returning the value argument (or 1); its other path calls RtlUnwind.
# setjmp: leaf function directly before it, saving those same buffer slots and returning 0.
longjmp_address = 0x83484630
setjmp_address = 0x83484360

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding between functions
]

# Leaf functions (no .pdata entry) containing jump tables. XenonRecomp's own boundary
