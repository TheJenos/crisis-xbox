; crysis2

sys_game_folder=GameCrysis2
sys_dll_game=CryGameCrysis2.dll

r_ShaderCompilerServer=192.168.14.180;192.168.14.181

log_IncludeTime = 1
sys_languages = "english,french"

log_verbosity = 3
log_FileVerbosity = 3
r_UseShadowsPool=0


sys_PakLogInvalidFileAccess=0




; Skip the intro movies (the video player does not start yet)
sys_intromoviesduringinit = 0

; Continue straight into the level after loading (no press-to-continue wait)
g_skipAfterLoadingScreen = 1

; Single player runs a local server and client connected in-process. In the
; browser, loading a level takes minutes, so the connection timed out while
; loading and the game waited forever. Never time it out.
net_inactivitytimeout = 100000
net_inactivitytimeoutDevmode = 100000
net_backofftimeout = 100000
net_highlatencytimelimit = 100000
sv_netLimboTimeout = 100000
net_enable_watchdog_timer = 0
